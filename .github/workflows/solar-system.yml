name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: ${{ secrets.MONGO_URI }}
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing
        strategy:
          matrix:
            nodejs_version: [20, 22, 24]
            operating_system: [ubuntu-latest, macos-latest]
            exclude:
             - nodejs_version: 20
               operating_system: macos-latest  
        runs-on: ${{ matrix.operating_system }}

        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version - ${{ matrix.nodejs_version }}
          uses: actions/setup-node@v4
          with:
            node-version: ${{ matrix.nodejs_version }}
   
        - name: Cache NPM Dependencies
          uses: actions/cache@v4
          with:
            path: ~/.npm
            key: ${{ runner.os }}-node-${{ matrix.nodejs_version }}-${{ hashFiles('package-lock.json') }}
            restore-keys: |
              ${{ runner.os }}-node-${{ matrix.nodejs_version }}-
              ${{ runner.os }}-node-

        - name: Install Dependencies
          run: npm install

        - name: Debug env
          run: |
           echo "MONGO_URI starts with: ${MONGO_URI:0:20}"
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result-${{ matrix.nodejs_version }}-${{ matrix.operating_system }}
            path: test-results.xml

    code-coverage:
      name: Code Coverage
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v4
          with:
            node-version: 20

        - name: Cache NPM Dependencies
          uses: actions/cache@v4
          with:
            path: ~/.npm
            key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}
            restore-keys: |
              ${{ runner.os }}-node-20-
              ${{ runner.os }}-node-

        - name: Install Dependencies
          run: npm install

        - name: Run Code Coverage
          run: npm run coverage

        - name: Archive Coverage Result
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5

    Docker:
      name: Containerization
      needs: [unit-testing,code-coverage]
      runs-on: ubuntu-latest
      steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_TOKEN}}

      - name: Docker Build & Testing
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{vars.DOCKER_USERNAME}}/solar-system:${{github.sha}}

      - name: Trivy Vulnerability Scan    #Scanning images and save report as artifact
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.DOCKER_USERNAME }}/solar-system:${{github.sha}}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0             # report only, never fail
          ignore-unfixed: true
          output: trivy-report.txt  # save report as file

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: Trivy-Scan-Report
          path: trivy-report.txt
          retention-days: 5

      - name: Docker Image testing
        run: |
         docker images
         docker run --name solar-system-app -d \
          -p 3000:3000 \
          -e MONGO_URI=$MONGO_URI \
          -e MONGO_USERNAME=$MONGO_USERNAME \
          -e MONGO_PASSWORD=$MONGO_PASSWORD \
          ${{vars.DOCKER_USERNAME}}/solar-system:${{github.sha}}

         export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
         echo $IP
         echo Testing Image URL using wget
         wget -q -O - 127.0.0.1:3000/live | grep live

      - name: Docker Push           # push only after scan and test pass
        run: docker push ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

